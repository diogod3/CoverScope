name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-notes: ${{ steps.version.outputs.release-notes }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Validate tag and package version
        id: version
        shell: pwsh
        run: |
          [xml] $project = Get-Content src/DD3.CoverScope.Web/DD3.CoverScope.Web.csproj
          $version = [string] $project.Project.PropertyGroup.Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match package version '$version'."
          }
          $releaseNotes = "docs/releases/$($env:GITHUB_REF_NAME).md"
          if (-not (Test-Path $releaseNotes)) {
            throw "Release notes were not found at '$releaseNotes'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release-notes=$releaseNotes" >> $env:GITHUB_OUTPUT

  validate-packages:
    needs: validate-release
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate-release, validate-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_NOTES: ${{ needs.validate-release.outputs.release-notes }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download tested package
        uses: actions/download-artifact@v8
        with:
          name: DD3.CoverScope.Tool-Linux
          path: artifacts/packages

      - name: Check publication setup
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "Set the NUGET_USER repository secret and configure NuGet trusted publishing; see docs/development.md."
            exit 1
          fi
          test -f "artifacts/packages/DD3.CoverScope.Tool.$PACKAGE_VERSION.nupkg"

      - name: Authenticate to NuGet.org
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/packages/DD3.CoverScope.Tool.$PACKAGE_VERSION.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "artifacts/packages/DD3.CoverScope.Tool.$PACKAGE_VERSION.nupkg"
          --prerelease
          --notes-file "$RELEASE_NOTES"
          --title "CoverScope $GITHUB_REF_NAME"
          --verify-tag
