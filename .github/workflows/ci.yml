name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DD3.CoverScope.sln

      - name: Build
        run: dotnet build DD3.CoverScope.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DD3.CoverScope.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/DD3.CoverScope.Web/DD3.CoverScope.Web.csproj --configuration Release --no-build --output artifacts/packages

      - name: Inspect package
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/packages/DD3.CoverScope.Tool.*.nupkg | Select-Object -First 1
          ./scripts/Inspect-Package.ps1 -PackagePath $package.FullName

      - name: Smoke-test installed tool
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/packages/DD3.CoverScope.Tool.*.nupkg | Select-Object -First 1
          ./scripts/Smoke-Test.ps1 -PackagePath $package.FullName

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: DD3.CoverScope.Tool-${{ runner.os }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
